name: Deploy portfolio and October Club
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: github-pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: october-club
    env:
      # Both values are public browser configuration, not server credentials.
      VITE_SUPABASE_URL: https://emgbizytsfoqicopvxfg.supabase.co
      VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_JmD5q18x8S4iOCX5rSATzw_E51eLYHd
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
          package_json_file: october-club/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: october-club/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - name: Validate public configuration
        run: node scripts/check-config.mjs
      - run: pnpm build
      - name: Add app to portfolio build source
        working-directory: .
        run: |
          test ! -e docs/october-club
          mkdir -p docs/october-club
          cp -R october-club/dist/. docs/october-club/
      - uses: actions/configure-pages@v5
      - name: Build existing portfolio and app together
        uses: actions/jekyll-build-pages@v1
        with:
          source: ./docs
          destination: ./_site
      - name: Verify both entry pages exist
        working-directory: .
        run: |
          test -f _site/index.html
          test -f _site/october-club/index.html
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
